<div class="d-flex align-items-center flex-wrap gap-2 mb-3">
  <h1 class="h5 mb-0">{{ titulo }} <span class="text-muted fw-normal">{{ inicio|date:"F"|capfirst }} de {{ inicio|date:"Y" }}</span></h1>
  <div class="ms-auto d-flex gap-2">
    <a href="?mes={{ anterior|date:'Y-m' }}" class="btn btn-sm btn-outline-secondary" title="Mês anterior"><i class="bi bi-chevron-left"></i></a>
    <a href="?mes={{ este|date:'Y-m' }}" class="btn btn-sm btn-outline-secondary">Este mês</a>
    <a href="?mes={{ proximo|date:'Y-m' }}" class="btn btn-sm btn-outline-secondary" title="Próximo mês"><i class="bi bi-chevron-right"></i></a>
  </div>
</div>
