<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Hamilton{% endblock %} · Hamilton</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  {% include "components/_tema.html" %}
  <style>
    /* O mesmo desenho da entrada: quem chega aqui veio de lá, e precisa reconhecer o lugar. */
    body { background: var(--escuro); padding-top: 0; }
    .entrada-marca { color: #fff; font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: .1em; }
    .entrada-marca i { color: var(--tinta-clara); }
    .entrada-sub, .entrada-pe { color: var(--escuro-suave, #b09b8b); }
    .entrada-pe a { color: #c9b6a6; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div style="width:100%; max-width:420px" class="px-3">
    <div class="text-center mb-4">
      <div class="entrada-marca mb-1"><i class="bi bi-clipboard2-pulse"></i> Hamilton</div>
      <div class="entrada-sub small">Gestão para o psicólogo clínico</div>
    </div>
    <div class="card"><div class="card-body p-4">{% block corpo %}{% endblock %}</div></div>
    <p class="entrada-pe text-center small mt-3 mb-0">
      <a href="{% url 'contas:entrar' %}" class="text-decoration-none">Voltar para a entrada</a>
    </p>
  </div>
</body>
</html>
