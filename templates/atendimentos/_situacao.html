{% comment %}As três situações da ADR-060, com a regra de cobrança logo abaixo.{% endcomment %}
<div class="form-label small mb-1">{{ campo.label }} <span class="text-danger">*</span></div>
{% for opcao in campo %}
  <div class="form-check form-check-inline">{{ opcao.tag }}
    <label class="form-check-label" for="{{ opcao.id_for_label }}">{{ opcao.choice_label }}</label></div>
{% endfor %}
<div class="form-text small">{{ campo.help_text }}</div>
{% for erro in campo.errors %}<div class="text-danger small">{{ erro }}</div>{% endfor %}
